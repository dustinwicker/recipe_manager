<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: visible;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .dropdown-container {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .dropdown-container label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }
        
        .filter-row {
            display: flex;
            align-items: center;
            margin-top: 14px;
        }
        
        .filter-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .filter-row label {
            display: inline;
            font-weight: 500;
            font-size: 0.98em;
            color: #555;
            margin-bottom: 0;
            cursor: pointer;
        }
        
        .recipe-combobox {
            position: relative;
        }
        
        .recipe-combobox-inner {
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            transition: border-color 0.3s;
        }
        
        .recipe-combobox-inner:hover, .recipe-combobox-inner.focused {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .recipe-combobox-input {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            background: transparent;
            outline: none;
        }
        
        .recipe-combobox-input::placeholder {
            color: #999;
        }
        
        .recipe-combobox-clear {
            padding: 15px 12px;
            color: #999;
            font-size: 1.2em;
            cursor: pointer;
            user-select: none;
            border: none;
            background: transparent;
            flex-shrink: 0;
            line-height: 1;
        }
        
        .recipe-combobox-clear:hover {
            color: #667eea;
        }
        
        .recipe-combobox-clear.hidden {
            display: none;
        }
        
        .recipe-combobox-arrow {
            padding: 15px 16px;
            color: #667eea;
            font-size: 1em;
            cursor: pointer;
            user-select: none;
            border: none;
            background: transparent;
            flex-shrink: 0;
        }
        
        .recipe-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 100;
            display: none;
        }
        
        .recipe-suggestions.visible {
            display: block;
        }
        
        .recipe-suggestion-item {
            display: block;
            padding: 14px 15px;
            line-height: 1.5;
            cursor: pointer;
            font-size: 1em;
            color: #333;
            border-bottom: 1px solid #eee;
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }
        
        .recipe-suggestion-item:last-child {
            border-bottom: none;
        }
        
        .recipe-suggestion-item:hover, .recipe-suggestion-item.highlighted {
            background: #f0f4ff;
        }
        
        .recipe-suggestion-item.no-results {
            cursor: default;
            color: #999;
        }
        
        .recipe-content {
            padding: 30px;
            min-height: 200px;
        }
        
        .recipe-content.hidden {
            display: none;
        }
        
        .recipe-link {
            margin-bottom: 30px;
        }
        
        .recipe-link a {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .recipe-link a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .section p {
            color: #555;
            line-height: 1.6;
        }
        
        #quick-recipe-content {
            white-space: pre-wrap;
        }
        
        .no-recipe {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            padding: 40px;
            font-size: 1.1em;
        }

        .try-recently {
            padding: 8px 30px 30px;
            border-top: 1px solid #e9ecef;
        }

        .try-recently h2 {
            color: #333;
            font-size: 1.25em;
            margin-bottom: 16px;
        }

        .try-recently-status {
            color: #777;
            margin: -8px 0 16px;
        }

        .try-recently-list {
            list-style: none;
        }

        .try-recently-item {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .try-recently-item:last-child {
            border-bottom: none;
        }

        .try-recently-title {
            background: none;
            border: none;
            padding: 0;
            color: #667eea;
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .try-recently-title:hover {
            text-decoration: underline;
        }

        .try-recently-link {
            flex-shrink: 0;
            color: #764ba2;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .try-recently-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍳 Recipe Manager</h1>
            <p>Select a recipe to view details</p>
        </div>
        
        <div class="dropdown-container" id="recipe-container">
            <label for="recipe-input">Choose a Recipe:</label>
            <div class="recipe-combobox">
                <div class="recipe-combobox-inner" id="recipe-combobox-inner">
                    <input type="text" id="recipe-input" class="recipe-combobox-input" placeholder="Type or select a recipe..." autocomplete="off" aria-label="Search or select recipe" />
                    <button type="button" class="recipe-combobox-clear hidden" id="recipe-clear" title="Clear" aria-label="Clear search">×</button>
                    <button type="button" class="recipe-combobox-arrow" id="recipe-arrow" title="Show all recipes" aria-label="Show all recipes">▼</button>
                </div>
                <div id="recipe-suggestions" class="recipe-suggestions"></div>
            </div>
            <div class="filter-row">
                <input type="checkbox" id="quick-only-filter" />
                <label for="quick-only-filter">Only show recipes with a Quick Recipe</label>
            </div>
        </div>
        
        <div class="recipe-content hidden" id="recipe-content">
            <div class="loading" id="loading">Loading recipes...</div>
            
            <div id="recipe-details" style="display: none;">
                <div class="recipe-link" id="recipe-link-section"></div>
                
                <div class="section" id="quick-recipe-section" style="display: none;">
                    <h3>📝 Quick Recipe</h3>
                    <p id="quick-recipe-content"></p>
                </div>
                
                <div class="section" id="picture-section" style="display: none;">
                    <h3>📷 Pictures</h3>
                    <div id="picture-content"></div>
                </div>
                
                <div class="section" id="note-section" style="display: none;">
                    <h3>📌 Note</h3>
                    <p id="note-content"></p>
                </div>
            </div>
        </div>

        <section class="try-recently" id="try-recently" hidden>
            <h2 id="try-recently-heading">Have you tried any of these 5 recently?</h2>
            <p class="try-recently-status" id="try-recently-status" hidden></p>
            <ul class="try-recently-list" id="try-recently-list"></ul>
        </section>
    </div>
    
    <script>
        const recipeContainer = document.getElementById('recipe-container');
        const recipeInput = document.getElementById('recipe-input');
        const recipeComboboxInner = document.getElementById('recipe-combobox-inner');
        const recipeClear = document.getElementById('recipe-clear');
        const recipeArrow = document.getElementById('recipe-arrow');
        const quickOnlyFilter = document.getElementById('quick-only-filter');
        const recipeSuggestions = document.getElementById('recipe-suggestions');
        const recipeContent = document.getElementById('recipe-content');
        const recipeDetails = document.getElementById('recipe-details');
        const loading = document.getElementById('loading');
        const recipeLinkSection = document.getElementById('recipe-link-section');
        const quickRecipeSection = document.getElementById('quick-recipe-section');
        const quickRecipeContent = document.getElementById('quick-recipe-content');
        const pictureSection = document.getElementById('picture-section');
        const pictureContent = document.getElementById('picture-content');
        const noteSection = document.getElementById('note-section');
        const noteContent = document.getElementById('note-content');
        const tryRecently = document.getElementById('try-recently');
        const tryRecentlyList = document.getElementById('try-recently-list');
        const tryRecentlyHeading = document.getElementById('try-recently-heading');
        const tryRecentlyStatus = document.getElementById('try-recently-status');

        let recipes = [];
        let recipeTitles = [];
        let activity = {};
        let activityReady = false;

        function hasOpened(title) {
            const row = activity[title];
            if (!row) return false;
            return (row.visits || 0) + (row.linkClicks || 0) > 0;
        }

        async function recordActivity(title, kind) {
            if (!title || !activityReady) return;
            const response = await fetch('/api/activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, kind })
            });
            if (!response.ok) return;
            activity[title] = await response.json();
        }

        function isQuickRecipeLink(linkInfo) {
            const text = (linkInfo && linkInfo.text ? linkInfo.text : '').trim().toLowerCase();
            return text === 'quick recipe' || text === 'quick_recipe' || text.endsWith('_recipe');
        }

        function recipeLinks(recipe) {
            const docs = recipe.google_doc_links || [];
            const externals = recipe.external_links || [];
            const quick = [...docs, ...externals].filter(isQuickRecipeLink);
            const rest = externals.filter(link => !isQuickRecipeLink(link));
            return quick.length ? quick.concat(rest) : rest;
        }

        function primaryRecipeLink(recipe) {
            return recipeLinks(recipe)[0] || null;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        function openFullRecipe(event, url, recipeTitle) {
            event.preventDefault();
            const opened = window.open(url, '_blank');
            if (opened) opened.opener = null;
            recordActivity(recipeTitle, 'link');
        }

        function openQuickRecipeWindow(recipe) {
            const text = (recipe.quick_recipe || '').trim();
            const source = recipeLinks(recipe).find(isQuickRecipeLink);
            if (!text && source && source.url) {
                const opened = window.open(source.url, '_blank');
                if (opened) opened.opener = null;
                recordActivity(recipe.title, 'link');
                return;
            }
            const opened = window.open('', '_blank');
            if (!opened) return;
            const body = text || 'No quick recipe text is saved for this recipe.';
            opened.document.open();
            opened.document.write(
                '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'
                + escapeHtml(recipe.title)
                + ' — Quick Recipe</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:32px;color:#333;line-height:1.6}h1{font-size:1.5rem;margin:0 0 8px}h2{color:#667eea;font-size:1.05rem;margin:0 0 20px}pre{white-space:pre-wrap;font-family:inherit;margin:0}</style></head><body><h1>'
                + escapeHtml(recipe.title)
                + '</h1><h2>Quick Recipe</h2><pre>'
                + escapeHtml(body)
                + '</pre></body></html>'
            );
            opened.document.close();
            opened.opener = null;
            recordActivity(recipe.title, 'link');
        }

        function shuffle(items) {
            const copy = items.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const swap = copy[i];
                copy[i] = copy[j];
                copy[j] = swap;
            }
            return copy;
        }

        function renderTryRecently(excludeTitle) {
            const excluded = (excludeTitle || '').toLowerCase();
            const picks = shuffle(
                recipes.filter(recipe => recipe.title.toLowerCase() !== excluded && !hasOpened(recipe.title))
            ).slice(0, 5);
            tryRecentlyHeading.textContent = picks.length === 5
                ? 'Have you tried any of these 5 recently?'
                : 'Have you tried any of these recently?';

            tryRecentlyList.innerHTML = '';
            picks.forEach(recipe => {
                const item = document.createElement('li');
                item.className = 'try-recently-item';

                const titleButton = document.createElement('button');
                titleButton.type = 'button';
                titleButton.className = 'try-recently-title';
                titleButton.textContent = recipe.title;
                titleButton.addEventListener('click', () => selectRecipe(recipe.title));
                item.appendChild(titleButton);

                const linkInfo = primaryRecipeLink(recipe);
                if (linkInfo && isQuickRecipeLink(linkInfo)) {
                    const opener = document.createElement('button');
                    opener.type = 'button';
                    opener.className = 'try-recently-link';
                    opener.textContent = 'Quick Recipe';
                    opener.addEventListener('click', () => openQuickRecipeWindow(recipe));
                    item.appendChild(opener);
                } else if (linkInfo && linkInfo.url) {
                    const link = document.createElement('a');
                    link.className = 'try-recently-link';
                    link.href = linkInfo.url;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = 'Full Recipe';
                    link.addEventListener('click', (event) => openFullRecipe(event, linkInfo.url, recipe.title));
                    item.appendChild(link);
                }

                tryRecentlyList.appendChild(item);
            });
            tryRecently.hidden = false;
            if (picks.length === 0) {
                tryRecentlyHeading.textContent = "You've opened every recipe.";
            }
        }

        function displayRecipe(recipe) {
            if (!recipe) {
                recipeContent.classList.add('hidden');
                return;
            }
            
            recipeContent.classList.remove('hidden');
            recipeDetails.style.display = 'block';
            loading.style.display = 'none';
            
            recipeLinkSection.innerHTML = '';
            recipeLinks(recipe).forEach(linkInfo => {
                if (isQuickRecipeLink(linkInfo)) return;
                const link = document.createElement('a');
                link.href = linkInfo.url;
                link.target = '_blank';
                link.rel = 'noopener';
                const label = (linkInfo.text || '').trim();
                link.textContent = (label && label !== 'Recipe') ? label : 'Full Recipe';
                link.className = 'external-link';
                link.addEventListener('click', (event) => openFullRecipe(event, linkInfo.url, recipe.title));
                recipeLinkSection.appendChild(link);
                recipeLinkSection.appendChild(document.createTextNode(' '));
            });
            
            if (recipe.quick_recipe && recipe.quick_recipe.trim()) {
                quickRecipeContent.textContent = recipe.quick_recipe;
                quickRecipeSection.style.display = 'block';
            } else {
                quickRecipeSection.style.display = 'none';
            }
            
            pictureContent.innerHTML = '';
            if (recipe.picture_links && recipe.picture_links.length > 0) {
                recipe.picture_links.forEach(picInfo => {
                    const imgContainer = document.createElement('div');
                    imgContainer.style.marginBottom = '20px';
                    imgContainer.style.textAlign = 'center';
                    const img = document.createElement('img');
                    img.src = picInfo.url;
                    img.alt = picInfo.text || 'Recipe picture';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '500px';
                    img.style.height = 'auto';
                    img.style.borderRadius = '10px';
                    img.style.display = 'block';
                    img.style.margin = '0 auto';
                    img.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
                    img.onerror = function() {
                        imgContainer.innerHTML = '';
                        const link = document.createElement('a');
                        link.href = picInfo.url;
                        link.target = '_blank';
                        link.textContent = picInfo.text || 'View Picture';
                        link.style.display = 'inline-block';
                        link.style.padding = '15px 30px';
                        link.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                        link.style.color = 'white';
                        link.style.textDecoration = 'none';
                        link.style.borderRadius = '10px';
                        link.style.fontWeight = '600';
                        link.style.marginTop = '10px';
                        imgContainer.appendChild(link);
                    };
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => window.open(picInfo.url, '_blank'));
                    imgContainer.appendChild(img);
                    pictureContent.appendChild(imgContainer);
                });
                pictureSection.style.display = 'block';
            } else {
                pictureSection.style.display = 'none';
            }
            
            if (recipe.note) {
                noteContent.textContent = recipe.note;
                noteSection.style.display = 'block';
            } else {
                noteSection.style.display = 'none';
            }
        }

        function loadRecipe(selectedRecipe) {
            if (!selectedRecipe) {
                recipeContent.classList.add('hidden');
                return;
            }
            const recipe = recipes.find(r => r.title.toLowerCase() === selectedRecipe.toLowerCase());
            if (!recipe) return;
            displayRecipe(recipe);
            recordActivity(recipe.title, 'visit');
        }

        function getActiveTitles() {
            if (!quickOnlyFilter.checked) return recipeTitles;
            return recipeTitles.filter(t => {
                const r = recipes.find(x => x.title.toLowerCase() === t.toLowerCase());
                return r && r.has_quick_recipe;
            });
        }

        function filterRecipes(query) {
            const pool = getActiveTitles();
            const q = (query || '').trim().toLowerCase();
            if (!q) return pool;
            return pool.filter(t => t.toLowerCase().includes(q));
        }

        function showSuggestions(matches) {
            recipeSuggestions.innerHTML = '';
            if (matches.length === 0) {
                const item = document.createElement('div');
                item.className = 'recipe-suggestion-item no-results';
                item.textContent = 'No matching recipes';
                recipeSuggestions.appendChild(item);
            } else {
                matches.forEach((title) => {
                    const item = document.createElement('div');
                    item.className = 'recipe-suggestion-item';
                    item.textContent = title;
                    item.dataset.recipe = title;
                    item.addEventListener('click', () => selectRecipe(title));
                    recipeSuggestions.appendChild(item);
                });
            }
            recipeSuggestions.classList.add('visible');
        }

        function updateClearVisibility() {
            recipeClear.classList.toggle('hidden', !recipeInput.value.trim());
        }

        function clearRecipe() {
            recipeInput.value = '';
            recipeSuggestions.classList.remove('visible');
            recipeComboboxInner.classList.remove('focused');
            recipeContent.classList.add('hidden');
            updateClearVisibility();
            recipeInput.focus();
        }

        function selectRecipe(title) {
            recipeInput.value = title;
            recipeSuggestions.classList.remove('visible');
            recipeComboboxInner.classList.remove('focused');
            recipeClear.classList.remove('hidden');
            loadRecipe(title);
        }

        function openSuggestions() {
            const matches = filterRecipes(recipeInput.value);
            showSuggestions(matches.length > 0 ? matches : getActiveTitles());
            recipeComboboxInner.classList.add('focused');
        }

        recipeInput.addEventListener('input', function() {
            updateClearVisibility();
            const matches = filterRecipes(this.value);
            showSuggestions(matches);
            recipeComboboxInner.classList.add('focused');
        });

        recipeInput.addEventListener('focus', openSuggestions);

        recipeClear.addEventListener('click', function(e) {
            e.preventDefault();
            clearRecipe();
        });

        recipeArrow.addEventListener('mousedown', function(e) {
            e.preventDefault();
            recipeInput.focus();
            openSuggestions();
        });

        quickOnlyFilter.addEventListener('change', function() {
            const activeTitles = getActiveTitles();
            const selected = recipeInput.value.trim().toLowerCase();
            if (selected && !activeTitles.some(t => t.toLowerCase() === selected)) {
                clearRecipe();
            }
            if (recipeSuggestions.classList.contains('visible')) {
                const matches = filterRecipes(recipeInput.value);
                showSuggestions(matches.length > 0 ? matches : activeTitles);
            }
        });

        recipeInput.addEventListener('keydown', function(e) {
            const items = recipeSuggestions.querySelectorAll('.recipe-suggestion-item:not(.no-results)');
            if (!recipeSuggestions.classList.contains('visible')) {
                if (e.key === 'Enter') loadRecipe(recipeInput.value.trim());
                return;
            }
            if (items.length === 0) {
                if (e.key === 'Escape') recipeSuggestions.classList.remove('visible');
                return;
            }
            const highlighted = recipeSuggestions.querySelector('.highlighted');
            let idx = highlighted ? Array.from(items).indexOf(highlighted) : -1;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                idx = Math.min(idx + 1, items.length - 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                idx = Math.max(idx - 1, 0);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (idx < 0) idx = 0;
                selectRecipe(items[idx].dataset.recipe);
                return;
            } else if (e.key === 'Escape') {
                recipeSuggestions.classList.remove('visible');
                return;
            }
            items.forEach((el, i) => el.classList.toggle('highlighted', i === idx));
        });

        document.addEventListener('click', function(e) {
            const combobox = document.querySelector('.recipe-combobox');
            if (!combobox.contains(e.target)) {
                recipeSuggestions.classList.remove('visible');
                recipeComboboxInner.classList.remove('focused');
            }
        });

        // Bypass CDN/browser cache so deploys show up without a hard refresh wait
        fetch('data/recipes.json?v=' + Date.now(), { cache: 'no-store' })
            .then(r => r.json())
            .then(data => {
                recipes = data;
                recipeTitles = recipes.map(r => r.title).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                loading.textContent = 'Select a recipe above';
                return fetch('/api/activity');
            })
            .then(response => {
                if (!response.ok) throw new Error('activity unavailable');
                return response.json();
            })
            .then(stored => {
                activity = stored && typeof stored === 'object' ? stored : {};
                activityReady = true;
                tryRecentlyStatus.hidden = true;
                renderTryRecently(recipeInput.value.trim());
            })
            .catch(() => {
                activityReady = false;
                if (recipes.length === 0) {
                    loading.textContent = 'No recipes loaded. Start the recipe server on this computer.';
                    return;
                }
                tryRecentlyStatus.hidden = false;
                tryRecentlyStatus.textContent = 'Open this page from the recipe server on this computer to save which recipes you have tried.';
                renderTryRecently(recipeInput.value.trim());
            });
    </script>
</body>
</html>
