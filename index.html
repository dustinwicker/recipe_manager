<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1180px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: visible;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .dropdown-container {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            font-size: 20px;
        }
        
        .dropdown-container label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 1em;
        }
        
        .filter-row {
            display: flex;
            align-items: center;
            margin-top: 14px;
        }
        
        .filter-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .filter-row label {
            display: inline;
            font-weight: 500;
            font-size: 1em;
            color: #555;
            margin-bottom: 0;
            cursor: pointer;
        }
        
        .recipe-combobox {
            position: relative;
        }
        
        .recipe-combobox-inner {
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            transition: border-color 0.3s;
        }
        
        .recipe-combobox-inner:hover, .recipe-combobox-inner.focused {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .recipe-combobox-input {
            flex: 1;
            padding: 15px;
            font-size: 1em;
            border: none;
            background: transparent;
            outline: none;
        }
        
        .recipe-combobox-input::placeholder {
            color: #999;
        }
        
        .recipe-combobox-clear {
            padding: 15px 12px;
            color: #999;
            font-size: 1.2em;
            cursor: pointer;
            user-select: none;
            border: none;
            background: transparent;
            flex-shrink: 0;
            line-height: 1;
        }
        
        .recipe-combobox-clear:hover {
            color: #667eea;
        }
        
        .recipe-combobox-clear.hidden {
            display: none;
        }
        
        .recipe-combobox-arrow {
            padding: 15px 16px;
            color: #667eea;
            font-size: 1em;
            cursor: pointer;
            user-select: none;
            border: none;
            background: transparent;
            flex-shrink: 0;
        }
        
        .recipe-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 100;
            display: none;
        }
        
        .recipe-suggestions.visible {
            display: block;
        }
        
        .recipe-suggestion-item {
            display: block;
            padding: 14px 15px;
            line-height: 1.5;
            cursor: pointer;
            font-size: 1em;
            color: #333;
            border-bottom: 1px solid #eee;
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }
        
        .recipe-suggestion-item:last-child {
            border-bottom: none;
        }
        
        .recipe-suggestion-item:hover, .recipe-suggestion-item.highlighted {
            background: #f0f4ff;
        }
        
        .recipe-suggestion-item.no-results {
            cursor: default;
            color: #999;
        }
        
        .recipe-content {
            padding: 30px;
            min-height: 200px;
            scroll-margin-top: 12px;
        }
        
        .recipe-content.hidden {
            display: none;
        }
        
        .recipe-link {
            margin-bottom: 30px;
        }
        
        .recipe-link a {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .recipe-link a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .section p {
            color: #555;
            line-height: 1.6;
        }
        
        #quick-recipe-content {
            white-space: pre-wrap;
            font-size: 20px;
            line-height: 1.55;
        }

        #quick-recipe-content u {
            text-underline-offset: 2px;
        }

        .quick-recipe-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 15px;
        }

        .quick-recipe-head h3 {
            margin-bottom: 0;
        }

        .shopping-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .quick-recipe-modes {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .quick-recipe-modes[hidden] {
            display: none;
        }

        .shopping-toggle[hidden] {
            display: none;
        }

        .mode-clear {
            border: none;
            background: transparent;
            color: #667eea;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .mode-clear[hidden] {
            display: none;
        }

        .shopping-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .ingredient-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .ingredient-check {
            width: 1.2rem;
            height: 1.2rem;
            margin-top: 0.4rem;
            flex: 0 0 auto;
            accent-color: #667eea;
            cursor: pointer;
        }

        #quick-recipe-section:not(.shopping) .ingredient-check {
            display: none;
        }

        #quick-recipe-section.shopping .ingredient-line.is-bought .ingredient-text {
            text-decoration: line-through;
            color: #8b909a;
        }

        .instruction-block + .instruction-block {
            margin-top: 1rem;
        }

        .step-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .step-check {
            width: 1.2rem;
            height: 1.2rem;
            margin-top: 0.4rem;
            flex: 0 0 auto;
            accent-color: #667eea;
            cursor: pointer;
        }

        #quick-recipe-section:not(.cooking) .step-check {
            display: none;
        }

        #quick-recipe-section.cooking .step-line.is-done .step-text {
            text-decoration: line-through;
            color: #8b909a;
        }

        .ingredient-word {
            cursor: pointer;
            border-radius: 4px;
        }

        .ingredient-word.is-picked,
        #quick-recipe-content mark.ingredient-hit {
            background: #ffe08a;
            color: inherit;
        }

        .quick-instructions {
            margin-top: 1rem;
        }

        .amount-hint {
            color: #667eea;
            font-weight: 600;
        }

        .servings-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: #333;
            font-weight: 600;
        }

        .servings-row button {
            width: 32px;
            height: 32px;
            border: 1px solid #d5d9e8;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-size: 1.2em;
            cursor: pointer;
        }

        .servings-input {
            width: 64px;
            padding: 6px 8px;
            border: 1px solid #d5d9e8;
            border-radius: 8px;
            font: inherit;
            text-align: center;
        }

        .scaled-ingredients {
            margin: 0 0 18px 1.2em;
            color: #555;
            line-height: 1.6;
        }

        .scaled-amount {
            font-weight: 600;
            color: #333;
        }

        .ingredient-group {
            list-style: none;
            margin: 14px 0 4px -18px;
            font-weight: 700;
            color: #333;
        }

        .scaled-steps {
            margin: 8px 0 0 1.2em;
            color: #555;
            line-height: 1.6;
        }

        .scaled-steps-label {
            margin: 0;
            color: #667eea;
            font-size: 1em;
        }
        
        .no-recipe {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1em;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            padding: 40px;
            font-size: 1.1em;
        }

        .try-recently {
            padding: 8px 30px 30px;
            border-top: 1px solid #e9ecef;
            font-size: 20px;
        }

        .try-recently h2 {
            color: #333;
            font-size: 1.25em;
            margin-bottom: 16px;
        }

        .try-recently-status {
            color: #777;
            margin: -8px 0 16px;
        }

        .try-recently-list {
            list-style: none;
        }

        .try-recently-item {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .try-recently-item:last-child {
            border-bottom: none;
        }

        .try-recently-title {
            background: none;
            border: none;
            padding: 0;
            color: #667eea;
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .try-recently-title:hover {
            text-decoration: underline;
        }

        .try-recently-link {
            flex-shrink: 0;
            color: #764ba2;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .try-recently-link:hover {
            text-decoration: underline;
        }

        .most-used-count {
            flex-shrink: 0;
            color: #777;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍳 Recipe Manager</h1>
            <p>Select a recipe to view details</p>
        </div>
        
        <div class="dropdown-container" id="recipe-container">
            <label for="recipe-input">Choose a Recipe:</label>
            <div class="recipe-combobox">
                <div class="recipe-combobox-inner" id="recipe-combobox-inner">
                    <input type="text" id="recipe-input" class="recipe-combobox-input" placeholder="Type or select a recipe..." autocomplete="off" aria-label="Search or select recipe" />
                    <button type="button" class="recipe-combobox-clear hidden" id="recipe-clear" title="Clear" aria-label="Clear search">×</button>
                    <button type="button" class="recipe-combobox-arrow" id="recipe-arrow" title="Show all recipes" aria-label="Show all recipes">▼</button>
                </div>
                <div id="recipe-suggestions" class="recipe-suggestions"></div>
            </div>
            <div class="filter-row">
                <input type="checkbox" id="quick-only-filter" />
                <label for="quick-only-filter">Only show recipes with a Quick Recipe</label>
            </div>
        </div>
        
        <div class="recipe-content hidden" id="recipe-content">
            <div class="loading" id="loading">Loading recipes...</div>
            
            <div id="recipe-details" style="display: none;">
                <div class="recipe-link" id="recipe-link-section"></div>
                
                <div class="section" id="quick-recipe-section" style="display: none;">
                    <div class="quick-recipe-head">
                        <h3 id="quick-recipe-heading">📝 Quick Recipe</h3>
                        <div class="quick-recipe-modes" id="quick-recipe-modes" hidden>
                            <label class="shopping-toggle">
                                <input type="checkbox" id="shopping-mode">
                                Shopping mode
                            </label>
                            <button type="button" class="mode-clear" id="shopping-clear" hidden>Clear</button>
                            <label class="shopping-toggle">
                                <input type="checkbox" id="cooking-mode">
                                Cooking mode
                            </label>
                            <button type="button" class="mode-clear" id="cooking-clear" hidden>Clear</button>
                        </div>
                    </div>
                    <div id="quick-recipe-content"></div>
                </div>

                <div class="section" id="scalable-recipe-section" style="display: none;">
                    <h3 id="scalable-recipe-heading">📝 Recipe</h3>
                    <div id="scalable-recipe-content"></div>
                </div>
                
                <div class="section" id="picture-section" style="display: none;">
                    <h3>📷 Pictures</h3>
                    <div id="picture-content"></div>
                </div>
                
                <div class="section" id="note-section" style="display: none;">
                    <h3>📌 Note</h3>
                    <p id="note-content"></p>
                </div>
            </div>
        </div>

        <section class="try-recently" id="try-recently" hidden>
            <h2 id="try-recently-heading">Have you tried any of these 5 recently?</h2>
            <p class="try-recently-status" id="try-recently-status" hidden></p>
            <ul class="try-recently-list" id="try-recently-list"></ul>
        </section>

        <section class="try-recently" id="most-used" hidden>
            <h2>Most used</h2>
            <ul class="try-recently-list" id="most-used-list"></ul>
        </section>
    </div>
    
    <script>
        const recipeContainer = document.getElementById('recipe-container');
        const recipeInput = document.getElementById('recipe-input');
        const recipeComboboxInner = document.getElementById('recipe-combobox-inner');
        const recipeClear = document.getElementById('recipe-clear');
        const recipeArrow = document.getElementById('recipe-arrow');
        const quickOnlyFilter = document.getElementById('quick-only-filter');
        const recipeSuggestions = document.getElementById('recipe-suggestions');
        const recipeContent = document.getElementById('recipe-content');
        const recipeDetails = document.getElementById('recipe-details');
        const loading = document.getElementById('loading');
        const recipeLinkSection = document.getElementById('recipe-link-section');
        const quickRecipeSection = document.getElementById('quick-recipe-section');
        const quickRecipeHeading = document.getElementById('quick-recipe-heading');
        const quickRecipeContent = document.getElementById('quick-recipe-content');
        const quickRecipeModes = document.getElementById('quick-recipe-modes');
        const shoppingMode = document.getElementById('shopping-mode');
        const shoppingClear = document.getElementById('shopping-clear');
        const cookingMode = document.getElementById('cooking-mode');
        const cookingClear = document.getElementById('cooking-clear');
        let activeIngredientPhrase = '';
        let quickRecipeTitle = '';
        let skipWordClick = false;
        const scalableRecipeSection = document.getElementById('scalable-recipe-section');
        const scalableRecipeContent = document.getElementById('scalable-recipe-content');
        const pictureSection = document.getElementById('picture-section');
        const pictureContent = document.getElementById('picture-content');
        const noteSection = document.getElementById('note-section');
        const noteContent = document.getElementById('note-content');
        const mostUsed = document.getElementById('most-used');
        const mostUsedList = document.getElementById('most-used-list');
        const tryRecently = document.getElementById('try-recently');
        const tryRecentlyList = document.getElementById('try-recently-list');
        const tryRecentlyHeading = document.getElementById('try-recently-heading');
        const tryRecentlyStatus = document.getElementById('try-recently-status');

        let recipes = [];
        let recipeTitles = [];
        const ACTIVITY_KEY = 'recipe-activity';
        const ACTIVITY_URL = 'https://script.google.com/macros/s/AKfycbyOZD4uj0RSBBOwII25DKlFDPEJbPo6dQwQseIehdygjyiT2hcsDIUoz_gO5xEtVhH4/exec';
        let activity = {};
        let activityReady = false;

        function loadLocalActivity() {
            try {
                const stored = JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '{}');
                return stored && typeof stored === 'object' ? stored : {};
            } catch (error) {
                return {};
            }
        }

        function saveLocalActivity() {
            localStorage.setItem(ACTIVITY_KEY, JSON.stringify(activity));
        }

        function mergeCounts(local, remote) {
            const titles = new Set([...Object.keys(local || {}), ...Object.keys(remote || {})]);
            const merged = {};
            titles.forEach(title => {
                const saved = (local && local[title]) || {};
                const server = (remote && remote[title]) || {};
                merged[title] = {
                    visits: Math.max(saved.visits || 0, server.visits || 0),
                    searches: Math.max(saved.searches || 0, server.searches || 0),
                    linkClicks: Math.max(saved.linkClicks || 0, server.linkClicks || 0),
                    lastAt: Math.max(saved.lastAt || 0, server.lastAt || 0)
                };
            });
            return merged;
        }

        function applyMerged(remote) {
            activity = mergeCounts(loadLocalActivity(), remote);
            saveLocalActivity();
        }

        function countsGrew(current, snapshot) {
            return Object.keys(current || {}).some(title => {
                const next = current[title] || {};
                const before = (snapshot && snapshot[title]) || {};
                return (next.visits || 0) > (before.visits || 0)
                    || (next.searches || 0) > (before.searches || 0)
                    || (next.linkClicks || 0) > (before.linkClicks || 0);
            });
        }

        function postActivity(body) {
            return fetch(ACTIVITY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body)
            }).then(response => {
                if (!response.ok) throw new Error('activity unavailable');
                return response.json();
            });
        }

        function refreshActivityLists() {
            renderMostUsed();
            if (recipes.length) renderTryRecently(recipeInput.value.trim());
        }

        function usageCount(row) {
            if (!row) return 0;
            return (row.visits || 0) + (row.searches || 0) + (row.linkClicks || 0);
        }

        function hasOpened(title) {
            return usageCount(activity[title]) > 0;
        }

        function renderMostUsed() {
            const ranked = recipes
                .map(recipe => ({ recipe, count: usageCount(activity[recipe.title]) }))
                .filter(item => item.count > 0)
                .sort((a, b) => b.count - a.count || (activity[b.recipe.title].lastAt || 0) - (activity[a.recipe.title].lastAt || 0))
                .slice(0, 8);
            mostUsedList.innerHTML = '';
            ranked.forEach(({ recipe, count }) => {
                const item = document.createElement('li');
                item.className = 'try-recently-item';
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'try-recently-title';
                button.textContent = recipe.title;
                button.addEventListener('click', () => showRecipeFromList(recipe.title));
                const times = document.createElement('span');
                times.className = 'most-used-count';
                times.textContent = count === 1 ? '1 time' : count + ' times';
                item.append(button, times);
                mostUsedList.appendChild(item);
            });
            mostUsed.hidden = ranked.length === 0;
        }

        function recordActivity(title, kind) {
            if (!title) return;
            const row = activity[title] || { visits: 0, searches: 0, linkClicks: 0, lastAt: 0 };
            if (kind === 'search') row.searches = (row.searches || 0) + 1;
            else if (kind === 'link') row.linkClicks = (row.linkClicks || 0) + 1;
            else row.visits = (row.visits || 0) + 1;
            row.lastAt = Date.now();
            activity[title] = row;
            saveLocalActivity();
            refreshActivityLists();
            if (!activityReady) return;
            postActivity({ action: 'record', title, kind })
                .then(remote => {
                    applyMerged(remote);
                    refreshActivityLists();
                })
                .catch(() => {});
        }

        function isQuickRecipeLink(linkInfo) {
            const text = (linkInfo && linkInfo.text ? linkInfo.text : '').trim().toLowerCase();
            return text === 'quick recipe' || text === 'quick_recipe' || text.endsWith('_recipe');
        }

        function recipeLinks(recipe) {
            const docs = recipe.google_doc_links || [];
            const externals = recipe.external_links || [];
            const quick = [...docs, ...externals].filter(isQuickRecipeLink);
            const rest = externals.filter(link => !isQuickRecipeLink(link));
            return quick.length ? quick.concat(rest) : rest;
        }

        function primaryRecipeLink(recipe) {
            return recipeLinks(recipe)[0] || null;
        }

        function fillFormattedText(container, text) {
            container.replaceChildren();
            const pattern = /\[\[u\]\]|\[\[\/u\]\]/g;
            let last = 0;
            let underlined = false;
            let match;
            function append(chunk) {
                if (!chunk) return;
                if (underlined) {
                    const mark = document.createElement('u');
                    mark.textContent = chunk;
                    container.appendChild(mark);
                } else {
                    container.appendChild(document.createTextNode(chunk));
                }
            }
            while ((match = pattern.exec(text)) !== null) {
                append(text.slice(last, match.index));
                underlined = match[0] === '[[u]]';
                last = match.index + match[0].length;
            }
            append(text.slice(last));
        }

        function stripMarks(text) {
            return String(text || '').replace(/\[\[\/?u\]\]/g, '');
        }

        function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function plainWord(piece) {
            return piece.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
        }

        function shoppingStorageKey(title) {
            return 'recipe-shopping:' + title;
        }

        function boughtIngredients(title) {
            try {
                const saved = JSON.parse(localStorage.getItem(shoppingStorageKey(title)) || '[]');
                return new Set(Array.isArray(saved) ? saved : []);
            } catch (error) {
                return new Set();
            }
        }

        function saveBoughtIngredients(title, bought) {
            localStorage.setItem(shoppingStorageKey(title), JSON.stringify([...bought]));
        }

        function cookingStorageKey(title) {
            return 'recipe-cooking:' + title;
        }

        function cookedSteps(title) {
            try {
                const saved = JSON.parse(localStorage.getItem(cookingStorageKey(title)) || '[]');
                return new Set(Array.isArray(saved) ? saved : []);
            } catch (error) {
                return new Set();
            }
        }

        function saveCookedSteps(title, done) {
            localStorage.setItem(cookingStorageKey(title), JSON.stringify([...done]));
        }

        function syncModeControls() {
            shoppingClear.hidden = !shoppingMode.checked;
            cookingClear.hidden = !cookingMode.checked;
            quickRecipeSection.classList.toggle('shopping', shoppingMode.checked);
            quickRecipeSection.classList.toggle('cooking', cookingMode.checked);
        }

        function clearCheckedRows(selector, title, storageKey) {
            localStorage.removeItem(storageKey(title));
            document.querySelectorAll(selector).forEach(row => {
                row.classList.remove('is-bought', 'is-done');
                const check = row.querySelector('input[type="checkbox"]');
                if (check) check.checked = false;
            });
        }

        function parseQuickSections(text) {
            const sections = [];
            let current = null;
            String(text || '').split('\n').forEach(line => {
                const plain = stripMarks(line).trim();
                if (!plain) {
                    if (current) current.lines.push('');
                    return;
                }
                if (!plain.startsWith('- ')) {
                    current = { heading: line, lines: [] };
                    sections.push(current);
                    return;
                }
                if (!current) {
                    current = { heading: '', lines: [] };
                    sections.push(current);
                }
                current.lines.push(line);
            });
            const ingredientIndex = sections.findIndex(section => /ingredient/i.test(stripMarks(section.heading)));
            return { sections, ingredientIndex };
        }

        function markMatches(root, phrase) {
            const cleaned = phrase.replace(/\s+/g, ' ').trim().replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
            if (cleaned.length < 2 || /^\d+$/.test(cleaned)) return;
            const parts = cleaned.split(' ').map(escapeRegExp);
            const source = parts.length === 1 ? '\\b' + parts[0] + '\\b' : parts.join('\\s+');
            const pattern = new RegExp(source, 'gi');
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                const text = node.nodeValue;
                pattern.lastIndex = 0;
                if (!pattern.test(text)) return;
                pattern.lastIndex = 0;
                const fragment = document.createDocumentFragment();
                let last = 0;
                let match;
                while ((match = pattern.exec(text)) !== null) {
                    if (match.index > last) fragment.append(document.createTextNode(text.slice(last, match.index)));
                    const hit = document.createElement('mark');
                    hit.className = 'ingredient-hit';
                    hit.textContent = match[0];
                    fragment.append(hit);
                    last = match.index + match[0].length;
                    if (!match[0]) pattern.lastIndex += 1;
                }
                if (last < text.length) fragment.append(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function markPickedWords(words, phrase) {
            const wanted = phrase.toLowerCase().split(/\s+/).filter(Boolean);
            if (!wanted.length) return;
            if (wanted.length === 1) {
                words.forEach(word => {
                    if (word.dataset.word.toLowerCase() === wanted[0]) word.classList.add('is-picked');
                });
                return;
            }
            for (let index = 0; index <= words.length - wanted.length; index += 1) {
                const slice = words.slice(index, index + wanted.length);
                if (slice.map(word => word.dataset.word.toLowerCase()).join(' ') === wanted.join(' ')) {
                    slice.forEach(word => word.classList.add('is-picked'));
                }
            }
        }

        const yieldAmounts = {};

        function chickenYieldSpec(title) {
            if (title !== 'Sesame Chicken') return null;
            return { base: 1, min: 0.5, step: 0.5, label: 'Chicken', unit: 'lb' };
        }

        function savedYield(title, base) {
            if (yieldAmounts[title]) return yieldAmounts[title];
            const saved = parseFloat(localStorage.getItem('recipe-yield:' + title));
            return saved > 0 ? saved : base;
        }

        function canonicalUnit(unit) {
            const value = unit.toLowerCase();
            if (value.startsWith('tablespoon')) return 'tablespoon';
            if (value.startsWith('teaspoon')) return 'teaspoon';
            if (value.startsWith('clove')) return 'clove';
            if (value === 'lb' || value === 'lbs') return 'lb';
            if (value.startsWith('pound')) return 'pound';
            return value;
        }

        function formatYield(amount, unit, another) {
            const shown = formatAmount(amount);
            const one = Math.abs(amount - 1) < 0.02;
            const label = unit === 'lb' ? 'lb' : (one ? unit : unit + 's');
            if (another && one) return 'another ' + label;
            if (another) return 'another ' + shown + ' ' + label;
            return shown + ' ' + label;
        }

        function garlicSpoons(cloves) {
            const tablespoons = Math.floor((cloves + 1e-6) / 3);
            const teaspoons = Math.round((cloves - tablespoons * 3) * 1000) / 1000;
            const parts = [];
            if (tablespoons) parts.push(formatAmount(tablespoons) + ' Tbsp');
            if (teaspoons > 0.02) parts.push(formatAmount(teaspoons) + ' tsp');
            return parts.join(' + ');
        }

        function wrapYieldAmounts(root) {
            const pattern = /\banother\s+tablespoon\b|\b(?:(\d+)\s+(\d+)\/(\d+)|(\d+)\/(\d+)|(\d+(?:\.\d+)?))\s+(tablespoons?|teaspoons?|cloves?|pounds?|lbs?)\b/gi;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode(node) {
                    if (!node.nodeValue || !/\d|another/i.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
                    if (node.parentElement && node.parentElement.closest('.yield-amount, .amount-hint, .quick-recipe-yield')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                const text = node.nodeValue;
                pattern.lastIndex = 0;
                if (!pattern.test(text)) return;
                pattern.lastIndex = 0;
                const fragment = document.createDocumentFragment();
                let last = 0;
                let match;
                while ((match = pattern.exec(text)) !== null) {
                    if (match.index > last) fragment.append(document.createTextNode(text.slice(last, match.index)));
                    const span = document.createElement('span');
                    span.className = 'yield-amount';
                    const raw = match[0];
                    let base = 1;
                    let unit = 'tablespoon';
                    let another = /^another/i.test(raw);
                    if (!another) {
                        if (match[1]) base = Number(match[1]) + Number(match[2]) / Number(match[3]);
                        else if (match[4]) base = Number(match[4]) / Number(match[5]);
                        else base = Number(match[6]);
                        unit = match[7];
                    }
                    span.dataset.base = String(base);
                    span.dataset.unit = canonicalUnit(unit);
                    if (another) span.dataset.another = '1';
                    span.textContent = raw;
                    fragment.append(span);
                    last = match.index + raw.length;
                    if (!raw) pattern.lastIndex += 1;
                }
                if (last < text.length) fragment.append(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function addGarlicHints(root) {
            root.querySelectorAll('.ingredient-text').forEach(text => {
                if (!/garlic/i.test(text.textContent)) return;
                const clove = [...text.querySelectorAll('.yield-amount')].find(span => span.dataset.unit === 'clove');
                if (!clove || text.querySelector('.amount-hint')) return;
                const hint = document.createElement('span');
                hint.className = 'amount-hint';
                hint.dataset.cloves = clove.dataset.base;
                hint.title = '3 medium cloves equal 1 tablespoon of minced garlic';
                showGarlicHint(hint, 1);
                text.appendChild(hint);
            });
        }

        function showGarlicHint(hint, factor) {
            hint.textContent = ' · about ' + garlicSpoons(Number(hint.dataset.cloves) * factor) + ' minced';
        }

        function applyYieldScale(root, factor) {
            root.querySelectorAll('.yield-amount').forEach(span => {
                span.textContent = formatYield(
                    Number(span.dataset.base) * factor,
                    span.dataset.unit,
                    span.dataset.another === '1'
                );
            });
            root.querySelectorAll('.amount-hint').forEach(hint => showGarlicHint(hint, factor));
        }

        function attachYieldControl(parent, title) {
            const spec = chickenYieldSpec(title);
            if (!spec) return;
            const chosen = savedYield(title, spec.base);
            yieldAmounts[title] = chosen;
            const row = document.createElement('div');
            row.className = 'servings-row quick-recipe-yield';
            const label = document.createElement('span');
            label.textContent = spec.label;
            const down = document.createElement('button');
            down.type = 'button';
            down.textContent = '−';
            down.setAttribute('aria-label', 'Less chicken');
            const input = document.createElement('input');
            input.type = 'number';
            input.min = String(spec.min);
            input.step = String(spec.step);
            input.value = String(chosen);
            input.className = 'servings-input';
            input.setAttribute('aria-label', 'Pounds of chicken');
            const up = document.createElement('button');
            up.type = 'button';
            up.textContent = '+';
            up.setAttribute('aria-label', 'More chicken');
            const unit = document.createElement('span');
            unit.textContent = spec.unit;
            row.append(label, down, input, up, unit);

            function remember(next) {
                const value = Math.max(spec.min, next);
                yieldAmounts[title] = value;
                input.value = String(value);
                localStorage.setItem('recipe-yield:' + title, String(value));
                applyYieldScale(quickRecipeContent, value / spec.base);
            }

            down.addEventListener('click', () => {
                remember(Math.round(((parseFloat(input.value) || spec.base) - spec.step) * 1000) / 1000);
            });
            up.addEventListener('click', () => {
                remember(Math.round(((parseFloat(input.value) || spec.base) + spec.step) * 1000) / 1000);
            });
            input.addEventListener('change', () => {
                const typed = parseFloat(input.value);
                remember(typed > 0 ? typed : spec.base);
            });
            parent.appendChild(row);
        }

        function renderInteractiveQuickRecipe(text, title) {
            const parsed = parseQuickSections(text);
            if (parsed.ingredientIndex < 0) {
                quickRecipeModes.hidden = true;
                quickRecipeSection.classList.remove('shopping', 'cooking');
                fillFormattedText(quickRecipeContent, text);
                return;
            }

            quickRecipeModes.hidden = false;
            syncModeControls();
            quickRecipeContent.replaceChildren();
            const bought = boughtIngredients(title);
            const ingredients = parsed.sections[parsed.ingredientIndex];
            const ingredientBlock = document.createElement('div');
            attachYieldControl(ingredientBlock, title);
            const heading = document.createElement('div');
            fillFormattedText(heading, ingredients.heading);
            ingredientBlock.appendChild(heading);

            const list = document.createElement('div');
            list.className = 'ingredient-list';
            ingredients.lines.filter(line => stripMarks(line).trim()).forEach(line => {
                const plainLine = stripMarks(line).trim();
                const row = document.createElement('div');
                row.className = 'ingredient-line';
                if (bought.has(plainLine)) row.classList.add('is-bought');
                const check = document.createElement('input');
                check.type = 'checkbox';
                check.className = 'ingredient-check';
                check.checked = bought.has(plainLine);
                check.setAttribute('aria-label', 'Got ' + plainLine.replace(/^- /, ''));
                check.addEventListener('change', () => {
                    const next = boughtIngredients(title);
                    if (check.checked) next.add(plainLine);
                    else next.delete(plainLine);
                    saveBoughtIngredients(title, next);
                    row.classList.toggle('is-bought', check.checked);
                });
                const textWrap = document.createElement('div');
                textWrap.className = 'ingredient-text';
                textWrap.append('- ');
                const words = [];
                const body = plainLine.replace(/^- /, '');
                const amountPattern = /\banother\s+tablespoon\b|\b(?:(\d+)\s+(\d+)\/(\d+)|(\d+)\/(\d+)|(\d+(?:\.\d+)?))\s+(tablespoons?|teaspoons?|cloves?|pounds?|lbs?)\b/gi;
                const pieces = [];
                let lastIndex = 0;
                let amountMatch;
                while ((amountMatch = amountPattern.exec(body)) !== null) {
                    if (amountMatch.index > lastIndex) pieces.push(body.slice(lastIndex, amountMatch.index));
                    pieces.push(amountMatch);
                    lastIndex = amountMatch.index + amountMatch[0].length;
                }
                if (lastIndex < body.length) pieces.push(body.slice(lastIndex));
                pieces.forEach(piece => {
                    if (typeof piece !== 'string') {
                        const raw = piece[0];
                        const span = document.createElement('span');
                        span.className = 'yield-amount';
                        let base = 1;
                        let unit = 'tablespoon';
                        const another = /^another/i.test(raw);
                        if (!another) {
                            if (piece[1]) base = Number(piece[1]) + Number(piece[2]) / Number(piece[3]);
                            else if (piece[4]) base = Number(piece[4]) / Number(piece[5]);
                            else base = Number(piece[6]);
                            unit = piece[7];
                        }
                        span.dataset.base = String(base);
                        span.dataset.unit = canonicalUnit(unit);
                        if (another) span.dataset.another = '1';
                        span.textContent = raw;
                        textWrap.append(span);
                        return;
                    }
                    piece.split(/(\s+)/).forEach(bit => {
                        if (!bit) return;
                        if (/^\s+$/.test(bit)) {
                            textWrap.append(bit);
                            return;
                        }
                        const word = plainWord(bit);
                        if (!word) {
                            textWrap.append(bit);
                            return;
                        }
                        const button = document.createElement('span');
                        button.className = 'ingredient-word';
                        button.dataset.word = word;
                        button.title = 'Show where this is used';
                        button.textContent = bit;
                        button.addEventListener('click', () => {
                            if (skipWordClick) {
                                skipWordClick = false;
                                return;
                            }
                            activeIngredientPhrase = word;
                            renderInteractiveQuickRecipe(text, title);
                        });
                        textWrap.append(button);
                        words.push(button);
                    });
                });
                markPickedWords(words, activeIngredientPhrase);
                row.append(check, textWrap);
                list.appendChild(row);
            });
            list.addEventListener('mouseup', () => {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed || !list.contains(selection.anchorNode)) return;
                const phrase = plainWord(selection.toString().replace(/\s+/g, ' ').trim());
                if (!phrase || phrase.length < 2) return;
                skipWordClick = true;
                activeIngredientPhrase = phrase;
                renderInteractiveQuickRecipe(text, title);
                selection.removeAllRanges();
            });
            ingredientBlock.appendChild(list);
            quickRecipeContent.appendChild(ingredientBlock);

            const instructions = document.createElement('div');
            instructions.className = 'quick-instructions';
            const done = cookedSteps(title);
            parsed.sections
                .filter((section, index) => index !== parsed.ingredientIndex)
                .forEach(section => {
                    if (!stripMarks([section.heading, ...section.lines].join('\n')).trim()) return;
                    const block = document.createElement('div');
                    block.className = 'instruction-block';
                    if (section.heading) {
                        const heading = document.createElement('div');
                        fillFormattedText(heading, section.heading);
                        block.appendChild(heading);
                    }
                    section.lines.forEach(line => {
                        const raw = stripMarks(line);
                        const plain = raw.trim();
                        if (!plain) return;
                        const indent = raw.length - raw.trimStart().length;
                        if (!plain.startsWith('- ')) {
                            const note = document.createElement('div');
                            fillFormattedText(note, line);
                            block.appendChild(note);
                            return;
                        }
                        const row = document.createElement('div');
                        row.className = 'step-line';
                        if (indent) row.style.paddingLeft = (Math.ceil(indent / 2) * 1.25) + 'rem';
                        if (done.has(plain)) row.classList.add('is-done');
                        const check = document.createElement('input');
                        check.type = 'checkbox';
                        check.className = 'step-check';
                        check.checked = done.has(plain);
                        check.setAttribute('aria-label', 'Done ' + plain.replace(/^- /, ''));
                        check.addEventListener('change', () => {
                            const next = cookedSteps(title);
                            if (check.checked) next.add(plain);
                            else next.delete(plain);
                            saveCookedSteps(title, next);
                            row.classList.toggle('is-done', check.checked);
                        });
                        const textWrap = document.createElement('div');
                        textWrap.className = 'step-text';
                        fillFormattedText(textWrap, line.trim());
                        row.append(check, textWrap);
                        block.appendChild(row);
                    });
                    instructions.appendChild(block);
                });
            if (activeIngredientPhrase) markMatches(instructions, activeIngredientPhrase);
            quickRecipeContent.appendChild(instructions);
            addGarlicHints(quickRecipeContent);
            if (chickenYieldSpec(title)) {
                wrapYieldAmounts(quickRecipeContent);
                applyYieldScale(quickRecipeContent, yieldAmounts[title] / chickenYieldSpec(title).base);
            }
        }

        shoppingMode.addEventListener('change', syncModeControls);
        cookingMode.addEventListener('change', syncModeControls);
        shoppingClear.addEventListener('click', () => {
            clearCheckedRows('#quick-recipe-content .ingredient-line', quickRecipeTitle, shoppingStorageKey);
        });
        cookingClear.addEventListener('click', () => {
            clearCheckedRows('#quick-recipe-content .step-line', quickRecipeTitle, cookingStorageKey);
        });

        function quickRecipeHtml(text) {
            return escapeHtml(text).replaceAll('[[u]]', '<u>').replaceAll('[[/u]]', '</u>');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        function openFullRecipe(event, url, recipeTitle) {
            event.preventDefault();
            const opened = window.open(url, '_blank');
            if (opened) opened.opener = null;
            recordActivity(recipeTitle, 'link');
        }

        function openLinkedRecipe(event, recipe) {
            const linkInfo = primaryRecipeLink(recipe);
            if (linkInfo && isQuickRecipeLink(linkInfo)) {
                event.preventDefault();
                openQuickRecipeWindow(recipe);
                return true;
            }
            if (linkInfo && linkInfo.url) {
                openFullRecipe(event, linkInfo.url, recipe.title);
                return true;
            }
            return false;
        }

        function openQuickRecipeWindow(recipe) {
            const text = (recipe.quick_recipe || '').trim();
            const source = recipeLinks(recipe).find(isQuickRecipeLink);
            if (!text && source && source.url) {
                const opened = window.open(source.url, '_blank');
                if (opened) opened.opener = null;
                recordActivity(recipe.title, 'link');
                return;
            }
            const opened = window.open('', '_blank');
            if (!opened) return;
            const body = text || 'No quick recipe text is saved for this recipe.';
            opened.document.open();
            opened.document.write(
                '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'
                + escapeHtml(recipe.title)
                + ' — Quick Recipe</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:32px;color:#333;line-height:1.55;font-size:20px}h1{font-size:1.6rem;margin:0 0 8px}h2{color:#667eea;font-size:1.15rem;margin:0 0 20px}pre{white-space:pre-wrap;font-family:inherit;font-size:1em;line-height:1.55;margin:0}</style></head><body><h1>'
                + escapeHtml(recipe.title)
                + '</h1><h2>Quick Recipe</h2><pre>'
                + quickRecipeHtml(body)
                + '</pre></body></html>'
            );
            opened.document.close();
            opened.opener = null;
            recordActivity(recipe.title, 'link');
        }

        function shuffle(items) {
            const copy = items.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const swap = copy[i];
                copy[i] = copy[j];
                copy[j] = swap;
            }
            return copy;
        }

        function renderTryRecently(excludeTitle) {
            const excluded = (excludeTitle || '').toLowerCase();
            const picks = shuffle(
                recipes.filter(recipe => recipe.title.toLowerCase() !== excluded && !hasOpened(recipe.title))
            ).slice(0, 5);
            tryRecentlyHeading.textContent = picks.length === 5
                ? 'Have you tried any of these 5 recently?'
                : 'Have you tried any of these recently?';

            tryRecentlyList.innerHTML = '';
            picks.forEach(recipe => {
                const item = document.createElement('li');
                item.className = 'try-recently-item';

                const linkInfo = primaryRecipeLink(recipe);
                const titleButton = document.createElement('button');
                titleButton.type = 'button';
                titleButton.className = 'try-recently-title';
                titleButton.textContent = recipe.title;
                titleButton.addEventListener('click', () => showRecipeFromList(recipe.title));
                titleButton.addEventListener('contextmenu', (event) => {
                    if (openLinkedRecipe(event, recipe)) event.preventDefault();
                });
                if (linkInfo && isQuickRecipeLink(linkInfo)) {
                    titleButton.title = 'Right-click to open the quick recipe';
                } else if (linkInfo && linkInfo.url) {
                    titleButton.title = 'Right-click to open the full recipe';
                }
                item.appendChild(titleButton);

                if (linkInfo && isQuickRecipeLink(linkInfo)) {
                    const opener = document.createElement('button');
                    opener.type = 'button';
                    opener.className = 'try-recently-link';
                    opener.textContent = 'Quick Recipe';
                    opener.addEventListener('click', (event) => openLinkedRecipe(event, recipe));
                    item.appendChild(opener);
                } else if (linkInfo && linkInfo.url) {
                    const link = document.createElement('a');
                    link.className = 'try-recently-link';
                    link.href = linkInfo.url;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = 'Full Recipe';
                    link.addEventListener('click', (event) => openLinkedRecipe(event, recipe));
                    item.appendChild(link);

                tryRecentlyList.appendChild(item);
            });
            tryRecently.hidden = false;
            if (picks.length === 0) {
                tryRecentlyHeading.textContent = "You've opened every recipe.";
            }
        }

        function formatAmount(value) {
            const number = Math.round(Number(value) * 1000) / 1000;
            if (!isFinite(number)) return '';
            const whole = Math.floor(number + 1e-8);
            const fraction = number - whole;
            const options = [
                [1, 8], [1, 6], [1, 4], [1, 3], [3, 8], [1, 2],
                [5, 8], [2, 3], [3, 4], [5, 6], [7, 8]
            ];
            let best = null;
            options.forEach(([numerator, denominator]) => {
                const diff = Math.abs(fraction - numerator / denominator);
                if (diff < 0.03 && (!best || diff < best.diff)) {
                    best = { numerator, denominator, diff };
                }
            });
            if (fraction < 0.03) return String(whole);
            if (!best) return String(Math.round(number * 100) / 100);
            const fractionText = best.numerator + '/' + best.denominator;
            return whole ? whole + ' ' + fractionText : fractionText;
        }

        function ingredientLabel(item) {
            const name = item.name || '';
            return item.note ? name + ' (' + item.note + ')' : name;
        }

        function renderScalableRecipe(spec, includeSteps) {
            const base = Number(spec.servings) || 1;
            scalableRecipeContent.textContent = '';

            const row = document.createElement('div');
            row.className = 'servings-row';
            const label = document.createElement('span');
            label.textContent = spec.yieldLabel || 'Servings';
            const down = document.createElement('button');
            down.type = 'button';
            down.textContent = '−';
            down.setAttribute('aria-label', 'Fewer servings');
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '1';
            input.step = '1';
            input.value = String(base);
            input.className = 'servings-input';
            input.setAttribute('aria-label', 'Number of servings');
            const up = document.createElement('button');
            up.type = 'button';
            up.textContent = '+';
            up.setAttribute('aria-label', 'More servings');
            row.append(label, down, input, up);

            const list = document.createElement('ul');
            list.className = 'scaled-ingredients';
            const rows = [];
            (spec.ingredients || []).forEach(item => {
                const line = document.createElement('li');
                if (item.header) {
                    line.className = 'ingredient-group';
                    line.textContent = item.name || '';
                    list.appendChild(line);
                    return;
                }
                const amount = document.createElement('span');
                amount.className = 'scaled-amount';
                line.append(amount, document.createTextNode(ingredientLabel(item)));
                list.appendChild(line);
                rows.push({ amount, item });
            });

            function shownAmount(value, factor) {
                return formatAmount(Number(value) * factor);
            }

            function update() {
                let servings = parseInt(input.value, 10);
                if (!servings || servings < 1) servings = 1;
                const factor = servings / base;
                rows.forEach(({ amount, item }) => {
                    if (item.amount === null || item.amount === undefined || item.amount === '') {
                        amount.textContent = '';
                        return;
                    }
                    let shown = shownAmount(item.amount, factor);
                    if (item.amountTo !== null && item.amountTo !== undefined && item.amountTo !== '') {
                        shown += '–' + shownAmount(item.amountTo, factor);
                    }
                    amount.textContent = shown + (item.unit ? ' ' + item.unit : '') + ' ';
                });
            }

            down.addEventListener('click', () => {
                input.value = String(Math.max(1, (parseInt(input.value, 10) || base) - 1));
                update();
            });
            up.addEventListener('click', () => {
                input.value = String((parseInt(input.value, 10) || base) + 1);
                update();
            });
            input.addEventListener('input', update);
            update();

            const stepsLabel = document.createElement('p');
            stepsLabel.className = 'scaled-steps-label';
            stepsLabel.textContent = 'Instructions';
            const steps = document.createElement('ol');
            steps.className = 'scaled-steps';
            (spec.steps || []).forEach(step => {
                const line = document.createElement('li');
                line.textContent = step;
                steps.appendChild(line);
            });

            if (includeSteps === false) {
                scalableRecipeContent.append(row, list);
            } else {
                scalableRecipeContent.append(row, list, stepsLabel, steps);
            }
        }

        function displayRecipe(recipe) {
            if (!recipe) {
                recipeContent.classList.add('hidden');
                return;
            }
            
            recipeContent.classList.remove('hidden');
            recipeDetails.style.display = 'block';
            loading.style.display = 'none';
            
            recipeLinkSection.innerHTML = '';
            recipeLinks(recipe).forEach(linkInfo => {
                if (isQuickRecipeLink(linkInfo)) return;
                const link = document.createElement('a');
                link.href = linkInfo.url;
                link.target = '_blank';
                link.rel = 'noopener';
                const label = (linkInfo.text || '').trim();
                link.textContent = (label && label !== 'Recipe') ? label : 'Full Recipe';
                link.className = 'external-link';
                link.addEventListener('click', (event) => openFullRecipe(event, linkInfo.url, recipe.title));
                recipeLinkSection.appendChild(link);
                recipeLinkSection.appendChild(document.createTextNode(' '));
            });
            
            const showQuick = recipe.quick_recipe && recipe.quick_recipe.trim() && !recipe.quick_from_scalable;
            const hasScalable = recipe.scalable && Array.isArray(recipe.scalable.ingredients);
            if (hasScalable) {
                renderScalableRecipe(recipe.scalable, !showQuick);
                scalableRecipeSection.style.display = 'block';
            } else {
                scalableRecipeSection.style.display = 'none';
            }

            if (showQuick) {
                if (quickRecipeTitle !== recipe.title) {
                    activeIngredientPhrase = '';
                    quickRecipeTitle = recipe.title;
                }
                quickRecipeHeading.textContent = '📝 Quick Recipe';
                renderInteractiveQuickRecipe(recipe.quick_recipe, recipe.title);
                quickRecipeContent.style.whiteSpace = 'pre-wrap';
                quickRecipeSection.style.display = 'block';
            } else {
                quickRecipeSection.style.display = 'none';
                quickRecipeModes.hidden = true;
                quickRecipeSection.classList.remove('shopping', 'cooking');
                quickRecipeTitle = '';
                activeIngredientPhrase = '';
            }
            
            pictureContent.innerHTML = '';
            if (recipe.picture_links && recipe.picture_links.length > 0) {
                recipe.picture_links.forEach(picInfo => {
                    const imgContainer = document.createElement('div');
                    imgContainer.style.marginBottom = '20px';
                    imgContainer.style.textAlign = 'center';
                    const img = document.createElement('img');
                    img.src = picInfo.url;
                    img.alt = picInfo.text || 'Recipe picture';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '500px';
                    img.style.height = 'auto';
                    img.style.borderRadius = '10px';
                    img.style.display = 'block';
                    img.style.margin = '0 auto';
                    img.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
                    img.onerror = function() {
                        imgContainer.innerHTML = '';
                        const link = document.createElement('a');
                        link.href = picInfo.url;
                        link.target = '_blank';
                        link.textContent = picInfo.text || 'View Picture';
                        link.style.display = 'inline-block';
                        link.style.padding = '15px 30px';
                        link.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                        link.style.color = 'white';
                        link.style.textDecoration = 'none';
                        link.style.borderRadius = '10px';
                        link.style.fontWeight = '600';
                        link.style.marginTop = '10px';
                        imgContainer.appendChild(link);
                    };
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => window.open(picInfo.url, '_blank'));
                    imgContainer.appendChild(img);
                    pictureContent.appendChild(imgContainer);
                });
                pictureSection.style.display = 'block';
            } else {
                pictureSection.style.display = 'none';
            }
            
            if (recipe.note) {
                noteContent.textContent = recipe.note;
                noteSection.style.display = 'block';
            } else {
                noteSection.style.display = 'none';
            }
        }

        function loadRecipe(selectedRecipe) {
            if (!selectedRecipe) {
                recipeContent.classList.add('hidden');
                return;
            }
            const recipe = recipes.find(r => r.title.toLowerCase() === selectedRecipe.toLowerCase());
            if (!recipe) return;
            displayRecipe(recipe);
            recordActivity(recipe.title, 'visit');
        }

        function getActiveTitles() {
            if (!quickOnlyFilter.checked) return recipeTitles;
            return recipeTitles.filter(t => {
                const r = recipes.find(x => x.title.toLowerCase() === t.toLowerCase());
                return r && r.has_quick_recipe;
            });
        }

        function filterRecipes(query) {
            const pool = getActiveTitles();
            const q = (query || '').trim().toLowerCase();
            if (!q) return pool;
            return pool.filter(t => t.toLowerCase().includes(q));
        }

        function showSuggestions(matches) {
            recipeSuggestions.innerHTML = '';
            if (matches.length === 0) {
                const item = document.createElement('div');
                item.className = 'recipe-suggestion-item no-results';
                item.textContent = 'No matching recipes';
                recipeSuggestions.appendChild(item);
            } else {
                matches.forEach((title) => {
                    const item = document.createElement('div');
                    item.className = 'recipe-suggestion-item';
                    item.textContent = title;
                    item.dataset.recipe = title;
                    item.addEventListener('click', () => selectRecipe(title));
                    recipeSuggestions.appendChild(item);
                });
            }
            recipeSuggestions.classList.add('visible');
        }

        function updateClearVisibility() {
            recipeClear.classList.toggle('hidden', !recipeInput.value.trim());
        }

        function clearRecipe() {
            recipeInput.value = '';
            recipeSuggestions.classList.remove('visible');
            recipeComboboxInner.classList.remove('focused');
            recipeContent.classList.add('hidden');
            updateClearVisibility();
            recipeInput.focus();
        }

        function showRecipeFromList(title) {
            selectRecipe(title);
            recipeContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function selectRecipe(title) {
            const typed = recipeInput.value.trim().toLowerCase();
            const searched = typed && typed !== title.toLowerCase() && title.toLowerCase().includes(typed);
            recipeInput.value = title;
            recipeSuggestions.classList.remove('visible');
            recipeComboboxInner.classList.remove('focused');
            recipeClear.classList.remove('hidden');
            loadRecipe(title);
            if (searched) recordActivity(title, 'search');
        }

        function openSuggestions() {
            const matches = filterRecipes(recipeInput.value);
            showSuggestions(matches.length > 0 ? matches : getActiveTitles());
            recipeComboboxInner.classList.add('focused');
        }

        recipeInput.addEventListener('input', function() {
            updateClearVisibility();
            const matches = filterRecipes(this.value);
            showSuggestions(matches);
            recipeComboboxInner.classList.add('focused');
        });

        recipeInput.addEventListener('focus', openSuggestions);

        recipeClear.addEventListener('click', function(e) {
            e.preventDefault();
            clearRecipe();
        });

        recipeArrow.addEventListener('mousedown', function(e) {
            e.preventDefault();
            recipeInput.focus();
            openSuggestions();
        });

        quickOnlyFilter.addEventListener('change', function() {
            const activeTitles = getActiveTitles();
            const selected = recipeInput.value.trim().toLowerCase();
            if (selected && !activeTitles.some(t => t.toLowerCase() === selected)) {
                clearRecipe();
            }
            if (recipeSuggestions.classList.contains('visible')) {
                const matches = filterRecipes(recipeInput.value);
                showSuggestions(matches.length > 0 ? matches : activeTitles);
            }
        });

        recipeInput.addEventListener('keydown', function(e) {
            const items = recipeSuggestions.querySelectorAll('.recipe-suggestion-item:not(.no-results)');
            if (!recipeSuggestions.classList.contains('visible')) {
                if (e.key === 'Enter') loadRecipe(recipeInput.value.trim());
                return;
            }
            if (items.length === 0) {
                if (e.key === 'Escape') recipeSuggestions.classList.remove('visible');
                return;
            }
            const highlighted = recipeSuggestions.querySelector('.highlighted');
            let idx = highlighted ? Array.from(items).indexOf(highlighted) : -1;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                idx = Math.min(idx + 1, items.length - 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                idx = Math.max(idx - 1, 0);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (idx < 0) idx = 0;
                selectRecipe(items[idx].dataset.recipe);
                return;
            } else if (e.key === 'Escape') {
                recipeSuggestions.classList.remove('visible');
                return;
            }
            items.forEach((el, i) => el.classList.toggle('highlighted', i === idx));
        });

        document.addEventListener('click', function(e) {
            const combobox = document.querySelector('.recipe-combobox');
            if (!combobox.contains(e.target)) {
                recipeSuggestions.classList.remove('visible');
                recipeComboboxInner.classList.remove('focused');
            }
        });

        // Bypass CDN/browser cache so deploys show up without a hard refresh wait
        fetch('data/recipes.json?v=' + Date.now(), { cache: 'no-store' })
            .then(r => r.json())
            .then(data => {
                recipes = data;
                recipeTitles = recipes.map(r => r.title).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                activity = loadLocalActivity();
                renderMostUsed();
                loading.textContent = 'Select a recipe above';
                const snapshot = loadLocalActivity();
                return postActivity({ action: 'sync', activity: snapshot }).then(remote => ({ remote, snapshot }));
            })
            .then(({ remote, snapshot }) => {
                const grew = countsGrew(loadLocalActivity(), snapshot);
                applyMerged(remote);
                if (!grew) {
                    activityReady = true;
                    tryRecentlyStatus.hidden = true;
                    refreshActivityLists();
                    return;
                }
                return postActivity({ action: 'sync', activity: loadLocalActivity() }).then(again => {
                    applyMerged(again);
                    activityReady = true;
                    tryRecentlyStatus.hidden = true;
                    refreshActivityLists();
                });
            })
            .catch(() => {
                activityReady = false;
                if (recipes.length === 0) {
                    loading.textContent = 'No recipes loaded. Start the recipe server on this computer.';
                    return;
                }
                activity = loadLocalActivity();
                tryRecentlyStatus.hidden = true;
                renderMostUsed();
                renderTryRecently(recipeInput.value.trim());
            });
    </script>
</body>
</html>
